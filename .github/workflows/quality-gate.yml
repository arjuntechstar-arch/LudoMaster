name: LudoMaster Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/realtime/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: |
          cd packages/game_engine && dart pub get
          cd ../../apps/mobile && flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Run quick quality gate
        shell: pwsh
        run: ./scripts/test.ps1 -Mode Quick

      - name: Upload quick validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-quality-results
          path: test-results/
          if-no-files-found: ignore

  multiplayer:
    name: Multiplayer & Reconnect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/realtime/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run multiplayer quality gate
        shell: pwsh
        run: ./scripts/test-multiplayer.ps1 -SimulationGames 300

  ui-quality:
    name: Flutter UI Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: |
          cd packages/game_engine && dart pub get
          cd ../../apps/mobile && flutter pub get
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install admin dependencies
        run: cd apps/admin && npm ci
      - name: Run UI quality gate
        shell: pwsh
        run: ./scripts/test-ui.ps1

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and security dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/realtime/requirements.txt
          pip install pytest pytest-asyncio httpx bandit pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Run application security checks
        shell: pwsh
        run: ./scripts/test-security.ps1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  load-smoke:
    name: Load & Stress Smoke
    runs-on: ubuntu-latest
    needs: [quick-validation, multiplayer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/realtime/requirements.txt
          pip install httpx pytest pytest-asyncio
      - name: Run load gate
        shell: pwsh
        run: ./scripts/test-load.ps1 -Clients 15 -Iterations 1

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs: [quick-validation, multiplayer, ui-quality, security, load-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all gates
        shell: bash
        run: |
          echo "quick-validation=${{ needs.quick-validation.result }}"
          echo "multiplayer=${{ needs.multiplayer.result }}"
          echo "ui-quality=${{ needs.ui-quality.result }}"
          echo "security=${{ needs.security.result }}"
          echo "load-smoke=${{ needs.load-smoke.result }}"
          test "${{ needs.quick-validation.result }}" = "success"
          test "${{ needs.multiplayer.result }}" = "success"
          test "${{ needs.ui-quality.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.load-smoke.result }}" = "success"
