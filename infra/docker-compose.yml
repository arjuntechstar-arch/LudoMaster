version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ludomaster-postgres
    restart: always
    environment:
      POSTGRES_USER: ludomaster
      POSTGRES_PASSWORD: ludomaster_secret_password
      POSTGRES_DB: ludomaster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludomaster -d ludomaster_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ludomaster-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: ludomaster-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://ludomaster:ludomaster_secret_password@postgres:5432/ludomaster_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_production_secret_key_change_me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    container_name: ludomaster-admin
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
